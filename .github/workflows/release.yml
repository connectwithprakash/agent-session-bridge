name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python

  # Publish runs in the SAME workflow, gated on the release output: a release
  # created with the default GITHUB_TOKEN cannot trigger a separate workflow.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  bump-tap:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/bump-tap.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
